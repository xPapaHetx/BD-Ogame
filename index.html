<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD OGame - PapaHet</title>

    <style>
        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            background:#111;
            font-family:Arial, sans-serif;
            color:white;
            display:flex;
            justify-content:center;
        }

        .conteneur{
            width:min(1600px,95vw);
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:16px;
            padding:20px;
        }

        img{
            width:100%;
            display:block;
            border-radius:6px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="conteneur">

<script>
for(let i=1;i<=41;i++){

    const img=document.createElement("img");

    img.src="images_uniformes/Case "+String(i).padStart(2,"0")+".png";

    document.currentScript.parentElement.appendChild(img);
}
</script>

</div>

</body>
</html>
