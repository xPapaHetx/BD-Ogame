<style>
:root{--bg:#090b0e;--panel:#14181d;--text:#f3f3f3;--muted:#aeb6bf;--gold:#d6aa4a}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;background:radial-gradient(circle at top,#202730 0,var(--bg) 520px);color:var(--text);font-family:Arial,sans-serif}
header{min-height:68vh;display:grid;place-items:center;padding:40px 20px;text-align:center}
.intro{max-width:850px;padding:32px;border:1px solid #d6aa4a55;border-radius:18px;background:#0c0f12dd;box-shadow:0 24px 80px #0008}
.kicker{color:var(--gold);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.82rem}
h1{margin:10px 0;font-size:clamp(2.3rem,7vw,5.6rem);line-height:.95}.sub{color:var(--muted);font-size:clamp(1rem,2vw,1.25rem)}
.start{display:inline-block;margin-top:22px;padding:13px 20px;border-radius:999px;background:var(--gold);color:#14100a;font-weight:800;text-decoration:none}
.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;padding:10px 16px;background:#0b0d10e8;border-bottom:1px solid #ffffff14;backdrop-filter:blur(10px)}
.track{height:7px;flex:1;background:#2a3037;border-radius:20px;overflow:hidden}#bar{height:100%;width:0;background:var(--gold)}
main{width:min(100%,1536px);margin:auto;padding-bottom:80px}figure{margin:0;background:#000}img{display:block;width:100%;height:auto;cursor:zoom-in}
.end{margin:70px 20px 0;padding:48px 20px;text-align:center;border:1px solid #d6aa4a40;border-radius:18px;background:var(--panel)}.end h2{font-size:clamp(2rem,6vw,4rem);margin:0 0 8px}.end p{color:var(--muted)}.end a{color:var(--gold)}
dialog{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#000f}dialog img{width:100%;height:100%;object-fit:contain;cursor:zoom-out}
@media(max-width:700px){header{min-height:55vh}.intro{padding:24px 18px}.toolbar strong{display:none}}
</style>

<dialog id="viewer"><img id="big" alt=""></dialog>
<script>
const bar=document.getElementById('bar');
function prog(){const m=document.documentElement.scrollHeight-innerHeight;bar.style.width=(m?scrollY/m*100:0)+'%'}
addEventListener('scroll',prog,{passive:true});addEventListener('resize',prog);prog();
const v=document.getElementById('viewer'),b=document.getElementById('big');
document.querySelectorAll('main figure img').forEach(i=>i.onclick=()=>{b.src=i.src;b.alt=i.alt;v.showModal()});
v.onclick=()=>v.close();
</script>
